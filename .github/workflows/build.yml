name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - run: gradle assembleDebug --stacktrace
      - run: cp app/build/outputs/apk/debug/app-debug.apk Inverter-widget.apk
      - uses: actions/upload-artifact@v4
        with:
          name: inverter-widget-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK as release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Інвертор — остання збірка
          body: Встановіть Inverter-widget.apk на телефон.
          make_latest: true
          files: Inverter-widget.apk
